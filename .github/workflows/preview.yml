name: PR Preview

# Builds every pull request (all locales) and deploys it to GitHub Pages at
# https://catlabinteractive.github.io/quizwitz-docs/pr-<number>/ so the end
# result can be reviewed before merging. Production (docs.quizwitz.com) is
# deployed separately and is not touched by this workflow.
on:
    pull_request:
        types: [opened, synchronize, reopened]

# A new push to a pull request cancels the previous build. Same group as
# cleanup-preview.yml, so closing the pull request cancels a running build
# that would otherwise deploy after the cleanup.
concurrency:
    group: ci-${{ github.event.pull_request.number }}-build
    cancel-in-progress: true

jobs:
    preview:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build
              env:
                  DOCS_URL: https://catlabinteractive.github.io
                  DOCS_BASE_URL: /quizwitz-docs/pr-${{ github.event.pull_request.number }}/
              run: npm run build

            - name: Deploy to GitHub Pages (PR Preview)
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./build
                  destination_dir: pr-${{ github.event.pull_request.number }}
                  keep_files: false

            - name: Comment PR with preview link
              uses: actions/github-script@v7
              with:
                  script: |
                      const prNumber = context.issue.number;
                      const { owner, repo } = context.repo;
                      const previewUrl = `https://${owner.toLowerCase()}.github.io/${repo}/pr-${prNumber}/`;

                      const body = `## 🚀 Preview Deployment

                      The docs for this PR are available for review:

                      **Preview URL:** ${previewUrl}

                      Other languages: add the locale to the path, for example ${previewUrl}nl/docs/intro`;

                      const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: prNumber });
                      const existing = comments.find(c => c.user.login.includes('[bot]') && c.body.includes('🚀 Preview Deployment'));

                      if (existing) {
                          await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                      } else {
                          await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
                      }
